name: CloudOps Lab Quality Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Bash scripts
        run: |
          bash -n scripts/system-health.sh

      - name: Validate Python scripts
        run: |
          python -m py_compile 04-Automation/python/system_info.py

      - name: Quality check complete
        run: echo "CloudOps-Lab validation successful."
